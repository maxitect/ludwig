name: ludwig

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ludwig
      POSTGRES_PASSWORD: ludwig
      POSTGRES_DB: ludwig
    ports:
      - "5432:5432"
    volumes:
      - ludwig-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ludwig -d ludwig"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ludwig-pgdata:
